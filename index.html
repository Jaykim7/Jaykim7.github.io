<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot Book Health - Jay Kim</title>
<style>
:root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --green: #3fb950; --red: #f85149; --yellow: #d29922; --blue: #58a6ff; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
h1 { font-size: 1.5rem; margin-bottom: 4px; }
.subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.875rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.card-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
.card-value { font-size: 1.75rem; font-weight: 600; margin-top: 4px; }
.card-delta { font-size: 0.8rem; margin-top: 2px; }
.up { color: var(--green); }
.down { color: var(--red); }
.flat { color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
th { background: #1c2128; color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.04em; }
tr:last-child td { border-bottom: none; }
.health-green { color: var(--green); }
.health-yellow { color: var(--yellow); }
.health-red { color: var(--red); }
.rec-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
.rec-SAVE { background: #f8514922; color: var(--red); }
.rec-EXPAND { background: #3fb95022; color: var(--green); }
.rec-DEEPEN { background: #d2992222; color: var(--yellow); }
.rec-MONITOR { background: #8b949e22; color: var(--muted); }
.rec-INVESTIGATE { background: #58a6ff22; color: var(--blue); }
.rec-OVERAGE { background: #f8514922; color: var(--red); }
.section-title { font-size: 1.1rem; margin: 24px 0 12px; }
.empty-state { text-align: center; padding: 48px; color: var(--muted); }
.last-updated { color: var(--muted); font-size: 0.75rem; text-align: right; margin-top: 16px; }
</style>
</head>
<body>
<h1>Copilot Book Health Tracker</h1>
<p class="subtitle">Jay Kim | Updated: <span id="asof">--</span></p>

<div class="grid" id="kpis"></div>

<h2 class="section-title">Account Details</h2>
<div id="table-container"></div>

<h2 class="section-title">Recommendations</h2>
<div id="recs-container"></div>

<p class="last-updated">Dashboard link: <a href="https://jaykim7.github.io/" style="color:var(--blue)">https://jaykim7.github.io/</a></p>

<script>
// Data injected by the daily workflow
const DATA = window.__COPILOT_HEALTH_DATA__ || null;

function render(data) {
  if (!data) {
    document.getElementById('kpis').innerHTML = '<div class="empty-state">No data yet. The daily workflow will populate this dashboard.</div>';
    return;
  }
  document.getElementById('asof').textContent = data.meta.as_of;

  // KPIs
  const kpis = [
    { label: 'Total Seats', value: data.book.seats_now, delta: data.book.seats_now - data.book.seats_1mo, suffix: ' vs 1mo' },
    { label: 'Active Users (28d)', value: data.book.active_28d || '--', delta: null },
    { label: 'Health Score (avg)', value: data.book.avg_health_score ? data.book.avg_health_score.toFixed(0) : '--', delta: null },
    { label: 'Accounts', value: data.accounts.length, delta: null },
  ];
  document.getElementById('kpis').innerHTML = kpis.map(k => `
    <div class="card">
      <div class="card-label">${k.label}</div>
      <div class="card-value">${typeof k.value === 'number' ? k.value.toLocaleString() : k.value}</div>
      ${k.delta !== null ? `<div class="card-delta ${k.delta > 0 ? 'up' : k.delta < 0 ? 'down' : 'flat'}">${k.delta > 0 ? '+' : ''}${k.delta}${k.suffix || ''}</div>` : ''}
    </div>
  `).join('');

  // Table
  if (data.accounts.length) {
    const rows = data.accounts.map(a => `<tr>
      <td>${a.name}</td>
      <td>${a.seats || '--'}</td>
      <td>${a.active_28d || '--'}</td>
      <td class="health-${(a.health||'').toLowerCase()}">${a.health || '--'}</td>
      <td>${a.health_score || '--'}</td>
      <td><span class="rec-badge rec-${a.recommendation || 'MONITOR'}">${a.recommendation || 'MONITOR'}</span></td>
    </tr>`).join('');
    document.getElementById('table-container').innerHTML = `<table><thead><tr><th>Account</th><th>Seats</th><th>Active 28d</th><th>Health</th><th>Score</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // Recommendations summary
  const buckets = {};
  data.accounts.forEach(a => { const b = a.recommendation || 'MONITOR'; buckets[b] = (buckets[b]||0) + 1; });
  document.getElementById('recs-container').innerHTML = Object.entries(buckets).map(([b,c]) =>
    `<span class="rec-badge rec-${b}" style="margin:4px;padding:4px 12px;font-size:0.85rem">${b}: ${c}</span>`
  ).join('');
}

// Try loading from data.json
fetch('data.json').then(r => r.ok ? r.json() : null).then(d => { window.__COPILOT_HEALTH_DATA__ = d; render(d); }).catch(() => render(null));
</script>
</body>
</html>
